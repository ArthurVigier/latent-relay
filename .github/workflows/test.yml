name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'                    # bloque le build comme avant
          severity: 'CRITICAL,HIGH,UNKNOWN' # ajuste selon ta tolérance
          ignore-unfixed: true
          cache: true

      - name: Install RTK (Token Optimizer)
        run: cargo install --git https://github.com/rtk-ai/rtk --quiet
        env:
          CARGO_NET_RETRY: "3"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_bridge.py -v
