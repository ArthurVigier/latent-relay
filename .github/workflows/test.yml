name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # pinned safe commit (v0.35.0 - mars 2026)
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,UNKNOWN'
          ignore-unfixed: true
          scanners: 'vuln'                    # désactive secret scanning → plus rapide
          cache: true
          additional-args: '--file-patterns requirements.txt'  # force le scan sur requirements.txt (plus fiable que uv.lock pour l'instant)

      - name: Install RTK (Token Optimizer)
        run: cargo install --git https://github.com/rtk-ai/rtk --quiet
        env:
          CARGO_NET_RETRY: "3"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_bridge.py -v
