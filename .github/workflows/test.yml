name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Locate ghost file
        run: find . -name "*transformers-stream-generator*"

      - name: Run security gate
        # On scanne AVANT l'installation pour éviter les fichiers temporaires de pip
        run: |
          cargo install --git https://github.com/Krigsexe/ai-rsk --quiet
          ai-rsk scan
        env:
          CARGO_NET_RETRY: "3"

      - name: Install RTK (Token Optimizer)
        run: cargo install --git https://github.com/rtk-ai/rtk --quiet
        env:
          CARGO_NET_RETRY: "3"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_bridge.py -v
