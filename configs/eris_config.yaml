# ERIS v5 — Configuration
# ========================
# All optional sections (sae, a_hat, concept_vectors) can be omitted
# or left with null paths — the system degrades gracefully.

# ── Zombie model ────────────────────────────────────────────────────────────
model_name: "Qwen/Qwen3-14B"   # or "Qwen/Qwen3-32B", "deepseek-ai/DeepSeek-V2-Lite"
device: "cuda:0"

# Default number of latent rollout steps (can be overridden per-request).
default_n_steps: 60

# ── SAE (Sparse Autoencoder) — optional ─────────────────────────────────────
sae:
  # model_path: "/path/to/sae_weights"   # directory or .pt file (sae-lens format)
  model_path: null
  layer: -1          # which hidden layer the SAE was trained on (-1 = last)
  # labels_path: "/path/to/feature_labels.json"
  labels_path: null
  top_k: 20          # number of top features to return

# ── Â-hat agentivity probe — optional ────────────────────────────────────────
a_hat:
  # model_path: "/path/to/a_hat_probe.pt"   # checkpoint from a-hat-optimizer
  model_path: null
  layer: -1

# ── Concept vectors for cosine map — optional ────────────────────────────────
concept_vectors:
  # Directory containing one .pt or .npy file per concept.
  # File stem is used as the concept name: "game_theory.pt" → "game_theory"
  vectors_dir: "configs/concept_vectors"

# ── Generation (zombie collaborate() step) ───────────────────────────────────
generation:
  # Disable chain-of-thought / thinking mode for the zombie.
  # Qwen3.x models support enable_thinking=False + thinking_budget=0.
  # Eliminates <think> blocks and reduces adversarial meta-discourse in output.
  enable_thinking: false
  temperature: 0.7
  top_p: 0.95

# ── Backend selection (used by eris/factory.py) ──────────────────────────────
backends:
  orchestrator:
    backend: "claude"
    model: "claude-sonnet-4-6"
    max_tokens: 2048
    # api_key: null   # reads ANTHROPIC_API_KEY from environment if not set

  probe:
    backend: "hf"
    model_id: "Qwen/Qwen3-14B"   # or "Qwen/Qwen3-32B", "deepseek-ai/DeepSeek-V2-Lite"
    layers: [9, 18]
    device: "cuda:0"
    dtype: "bfloat16"            # "bfloat16" | "float32" | "float16"

# ── Multi-agent coordination (used by eris/factory.py create_coordinator) ────
multi_agent:
  mode: "isolated"               # "isolated" | "shared_medium" | "collaborative"
  n_agents: 2
  checkpoint_every: 3
  voting_strategy: "majority"    # "majority" | "leader" | "consensus" (collaborative only)

# ── HTTP server ──────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8001
  max_payload_bytes: 2147483648      # 2 GB — covers multi-layer DeepSeek R1 responses
  max_payload_warning_bytes: 524288000  # 500 MB — log warning above this
  # For single-GPU setups with limited RAM, reduce max_payload_bytes to 524288000 (500 MB)
  # and use single-layer-per-call encoding (eval_m4_diagnostic_v3 strategy).
