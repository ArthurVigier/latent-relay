# ai-rsk configuration - Surgical exclusion for Phase 2
tool_timeout_seconds: 120

# Exclusion stricte du fichier mal formé qui bloque le parseur
exclude:
  - "**/transformers-stream-generator-*.tar.gz"

tools:
  osv-scanner:
    arguments:
      - "--ignore-paths=**/transformers-stream-generator-*.tar.gz"
